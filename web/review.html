<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面试复盘 — Dolphin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --purple-50: #faf5ff; --purple-100: #f3e8ff; --purple-200: #e9d5ff;
      --purple-300: #d8b4fe; --purple-400: #c084fc; --purple-500: #a855f7;
      --purple-600: #9333ea; --purple-700: #7e22ce;
      --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
      --gray-300: #d1d5db; --gray-500: #6b7280; --gray-700: #374151; --gray-900: #111827;
    }
    body { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; line-height: 1.6; color: var(--gray-900); min-height: 100vh; }
    .page-gradient { background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 30%, #ddd6fe 60%, #e8e0ff 100%); min-height: 100vh; display: flex; flex-direction: column; }

    header { display: flex; align-items: center; justify-content: space-between; padding: 20px 48px; background: rgba(255,255,255,0.65); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(167,139,250,0.15); position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--gray-900); }
    .logo-icon { width: 32px; height: 32px; }
    .logo-text { font-size: 16px; font-weight: 700; background: linear-gradient(135deg, var(--purple-600), var(--purple-400)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .tagline { font-size: 11px; color: var(--gray-500); }
    .phase-badge { font-size: 12px; color: var(--purple-600); background: var(--purple-50); border: 1px solid rgba(167,139,250,0.25); padding: 4px 12px; border-radius: 20px; font-weight: 500; }

    main { flex: 1; max-width: 960px; width: 100%; margin: 0 auto; padding: 40px 48px 60px; }

    .section-header { margin-bottom: 24px; }
    .section-title { font-size: 22px; font-weight: 700; color: var(--gray-900); margin-bottom: 4px; }
    .section-desc { font-size: 13px; color: var(--gray-500); }

    .card { background: rgba(255,255,255,0.88); border: 1px solid rgba(167,139,250,0.18); border-radius: 20px; padding: 32px; box-shadow: 0 4px 24px rgba(147,51,234,0.06); margin-bottom: 24px; }

    /* Score grid */
    .score-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 28px; }
    .score-item { background: rgba(250,245,255,0.6); border: 1px solid rgba(167,139,250,0.2); border-radius: 14px; padding: 20px; text-align: center; }
    .score-val { font-size: 36px; font-weight: 700; background: linear-gradient(135deg, var(--purple-700), var(--purple-400)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; }
    .score-label { font-size: 11px; color: var(--gray-500); margin-top: 6px; font-weight: 500; }
    .score-sub { font-size: 10px; color: var(--gray-400); margin-top: 2px; }

    /* Dimensions */
    .dim-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; margin-bottom: 24px; }
    .dim-item { background: rgba(250,245,255,0.5); border: 1px solid rgba(167,139,250,0.2); border-radius: 12px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    .dim-name { font-size: 12px; font-weight: 600; color: var(--gray-700); }
    .dim-bar-wrap { flex: 1; margin: 0 12px; height: 4px; background: var(--purple-100); border-radius: 2px; overflow: hidden; margin-left: 12px; margin-right: 12px; }
    .dim-bar { height: 100%; background: linear-gradient(90deg, var(--purple-500), var(--purple-300)); border-radius: 2px; transition: width 1s cubic-bezier(0.4,0,0.2,1); }
    .dim-score { font-size: 13px; font-weight: 700; color: var(--purple-600); min-width: 32px; text-align: right; }

    /* Tabs */
    .tabs { display: flex; gap: 4px; background: var(--purple-50); border: 1px solid rgba(167,139,250,0.2); border-radius: 12px; padding: 4px; margin-bottom: 20px; width: fit-content; }
    .tab { padding: 7px 18px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--gray-600); cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 0.15s; }
    .tab.active { background: white; color: var(--purple-700); font-weight: 600; box-shadow: 0 1px 4px rgba(147,51,234,0.12); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* Q&A items */
    .qa-item { background: rgba(250,245,255,0.4); border: 1px solid rgba(167,139,250,0.15); border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; }
    .qa-q { font-size: 12px; font-weight: 700; color: var(--purple-600); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .qa-q-text { font-size: 14px; font-weight: 600; color: var(--gray-900); margin-bottom: 10px; }
    .qa-user-label { font-size: 11px; font-weight: 600; color: var(--gray-500); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .qa-user-a { font-size: 13px; color: var(--gray-700); background: rgba(255,255,255,0.6); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.6; }
    .qa-ideal-label { font-size: 11px; font-weight: 600; color: #16a34a; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .qa-ideal-a { font-size: 13px; color: #166534; background: rgba(240,253,244,0.7); border-radius: 8px; padding: 10px 12px; line-height: 1.7; border: 1px solid rgba(74,222,128,0.2); }

    /* Category group */
    .cat-group { margin-bottom: 24px; }
    .cat-title { font-size: 13px; font-weight: 700; color: var(--gray-700); margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid rgba(167,139,250,0.15); display: flex; align-items: center; gap: 8px; }
    .cat-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--purple-400); flex-shrink: 0; }

    /* Textarea paste area */
    .paste-area { margin-bottom: 24px; }
    .paste-label { font-size: 13px; font-weight: 600; color: var(--gray-700); margin-bottom: 10px; display: block; }
    textarea { width: 100%; border: 1px solid rgba(167,139,250,0.3); border-radius: 14px; padding: 14px 16px; font-family: inherit; font-size: 13px; line-height: 1.7; resize: vertical; min-height: 160px; outline: none; background: rgba(250,245,255,0.5); color: var(--gray-900); transition: border-color 0.2s, box-shadow 0.2s; }
    textarea:focus { border-color: var(--purple-400); box-shadow: 0 0 0 3px rgba(167,139,250,0.12); background: white; }
    textarea::placeholder { color: var(--gray-500); }

    .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: linear-gradient(135deg, var(--purple-600), var(--purple-500)); color: white; border: none; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(147,51,234,0.3); text-decoration: none; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(147,51,234,0.4); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .btn-ghost { display: inline-flex; align-items: center; gap: 6px; padding: 12px 20px; background: rgba(255,255,255,0.8); color: var(--purple-700); border: 1px solid rgba(167,139,250,0.3); border-radius: 12px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .btn-ghost:hover { background: white; border-color: var(--purple-300); }

    /* Loading */
    .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(250,245,255,0.75); backdrop-filter: blur(6px); z-index: 999; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    .loading-overlay.active { display: flex; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--purple-100); border-top-color: var(--purple-500); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--purple-600); font-weight: 500; }

    footer { text-align: center; padding: 24px 48px; font-size: 12px; color: var(--gray-500); border-top: 1px solid rgba(167,139,250,0.1); background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); }
  </style>
</head>
<body>
<div class="page-gradient">

  <header>
    <a class="logo" href="/">
      <svg class="logo-icon" viewBox="0 0 64 64" fill="none">
        <defs><linearGradient id="dg4" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#9333ea"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs>
        <path d="M48 20C48 20 56 14 58 22C60 30 52 34 44 36C36 38 26 40 18 36C10 32 6 24 10 18C14 12 24 12 32 16C40 20 44 26 44 26" stroke="url(#dg4)" stroke-width="2.5" stroke-linecap="round" fill="rgba(167,139,250,0.08)"/>
        <path d="M18 36C14 34 10 30 12 26" stroke="url(#dg4)" stroke-width="2" stroke-linecap="round"/>
        <path d="M44 26C46 22 50 18 52 22" stroke="url(#dg4)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="52" cy="22" r="2" fill="#9333ea" opacity="0.6"/>
      </svg>
      <div><div class="logo-text">Dolphin</div><div class="tagline">AI 面试助手</div></div>
    </a>
    <div class="phase-badge">Phase 3 · 面试复盘</div>
  </header>

  <main>

    <div class="section-header">
      <div class="section-title">面试复盘</div>
      <div class="section-desc">粘贴面试问答记录，AI 将进行打分评估并给出最佳回答参考</div>
    </div>

    <!-- Paste area -->
    <div class="paste-area">
      <label class="paste-label">粘贴面试问答记录（可粘贴完整的对话文本）</label>
      <textarea id="pasteText" placeholder="粘贴格式示例：
Q1: 请介绍一下你最近做的一个项目，你在其中的角色是什么？
A1: 我最近做了一个电商推荐系统，我负责后端架构设计...
（或直接粘贴原始面试记录）"></textarea>
    </div>

    <div style="display:flex; gap:12px; margin-bottom:32px;">
      <button class="btn-primary" onclick="analyzeReview()" id="analyzeBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
        开始复盘分析
      </button>
      <a href="/interview.html" class="btn-ghost">重新模拟面试</a>
    </div>

    <!-- Results -->
    <div id="reviewResult" style="display:none;">

      <!-- Overall scores -->
      <div class="card">
        <div class="score-grid" id="scoreGrid">
          <div class="score-item">
            <div class="score-val" id="totalScore">--</div>
            <div class="score-label">综合得分</div>
            <div class="score-sub">百分制</div>
          </div>
          <div class="score-item">
            <div class="score-val" id="contentScore">--</div>
            <div class="score-label">内容质量</div>
            <div class="score-sub">回答完整度</div>
          </div>
          <div class="score-item">
            <div class="score-val" id="depthScore">--</div>
            <div class="score-label">深度表达</div>
            <div class="score-sub">技术洞察</div>
          </div>
        </div>

        <!-- Dimension bars -->
        <div class="dim-grid" id="dimGrid"></div>
      </div>

      <!-- Tabs -->
      <div class="tabs">
        <button class="tab active" onclick="switchTab(this, 'tab-qa')">问题与最佳回答</button>
        <button class="tab" onclick="switchTab(this, 'tab-bycat')">按类别整理</button>
        <button class="tab" onclick="switchTab(this, 'tab-raw')">原始输出</button>
      </div>

      <div id="tab-qa" class="tab-content active">
        <div id="qaList"></div>
      </div>

      <div id="tab-bycat" class="tab-content active">
        <div id="catList"></div>
      </div>

      <div id="tab-raw" class="tab-content">
        <div class="card" style="background:rgba(250,245,255,0.4);">
          <pre id="rawOutput" style="font-size:12px; color:var(--gray-700); white-space:pre-wrap; line-height:1.8; font-family:inherit;"></pre>
        </div>
      </div>

    </div>

  </main>

  <footer>Powered by MiniMax · Dolphin AI</footer>
</div>

<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">正在分析复盘中…</div>
</div>

<script>
  function switchTab(btn, id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(id).classList.add('active');
  }

  async function analyzeReview() {
    const text = document.getElementById('pasteText').value.trim();
    if (!text) { alert('请粘贴面试问答记录'); return; }

    showLoading(true);
    try {
      const res = await fetch('/api/review', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ conversation: text })
      });
      const data = await res.json();
      renderReview(data);
    } catch(e) {
      alert('分析失败: ' + e.message);
    } finally {
      showLoading(false);
    }
  }

  function renderReview(data) {
    document.getElementById('reviewResult').style.display = 'block';
    document.getElementById('reviewResult').scrollIntoView({ behavior: 'smooth' });

    // Scores
    document.getElementById('totalScore').textContent = data.total_score ?? '--';
    document.getElementById('contentScore').textContent = data.content_score ?? '--';
    document.getElementById('depthScore').textContent = data.depth_score ?? '--';

    // Dimension bars
    const dims = data.dimensions || [];
    const dimGrid = document.getElementById('dimGrid');
    if (dims.length > 0) {
      dimGrid.innerHTML = dims.map(d => `
        <div class="dim-item">
          <div class="dim-name">${escHtml(d.name || '')}</div>
          <div class="dim-bar-wrap"><div class="dim-bar" style="width:${d.score || 0}%"></div></div>
          <div class="dim-score">${d.score || 0}</div>
        </div>`).join('');
    } else {
      dimGrid.innerHTML = '';
    }

    // Q&A list
    const qaList = data.questions || [];
    document.getElementById('qaList').innerHTML = qaList.length
      ? qaList.map((q, i) => `
        <div class="qa-item">
          <div class="qa-q">问题 ${i + 1}</div>
          <div class="qa-q-text">${escHtml(q.question || q.q || '')}</div>
          <div class="qa-user-label">你的回答</div>
          <div class="qa-user-a">${escHtml(q.user_answer || q.a || '')}</div>
          <div class="qa-ideal-label">最佳回答参考</div>
          <div class="qa-ideal-a">${escHtml(q.ideal_answer || q.ideal || '')}</div>
        </div>`).join('')
      : '<p style="color:var(--gray-500);font-size:13px;">暂无数据</p>';

    // By category
    const byCat = data.by_category || {};
    document.getElementById('catList').innerHTML = Object.keys(byCat).length
      ? Object.entries(byCat).map(([cat, items]) => `
        <div class="cat-group">
          <div class="cat-title"><span class="cat-dot"></span>${escHtml(cat)}（${items.length} 题）</div>
          ${items.map((q, i) => `
          <div class="qa-item">
            <div class="qa-q-text">${escHtml(q.question || q.q || '')}</div>
            <div class="qa-user-label">你的回答</div>
            <div class="qa-user-a">${escHtml(q.user_answer || q.a || '')}</div>
            <div class="qa-ideal-label">最佳回答参考</div>
            <div class="qa-ideal-a">${escHtml(q.ideal_answer || q.ideal || '')}</div>
          </div>`).join('')}
        </div>`).join('')
      : '<p style="color:var(--gray-500);font-size:13px;">暂无分类数据</p>';

    // Raw
    document.getElementById('rawOutput').textContent = JSON.stringify(data, null, 2);

    // Tab fix - both "问题与最佳回答" and "按类别整理" were marked active
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    document.getElementById('tab-qa').classList.add('active');
    document.querySelectorAll('.tab')[0].classList.add('active');
  }

  function showLoading(show) {
    document.getElementById('loadingOverlay').classList.toggle('active', show);
    document.getElementById('analyzeBtn').disabled = show;
  }

  function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
