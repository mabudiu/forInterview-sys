<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interview System — 海豚面试官</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --purple-50: #faf5ff; --purple-100: #f3e8ff; --purple-200: #e9d5ff;
      --purple-300: #d8b4fe; --purple-400: #c084fc; --purple-500: #a855f7;
      --purple-600: #9333ea; --purple-700: #7e22ce;
      --gray-50: #f9fafb; --gray-100: #f3f4f6; --gray-200: #e5e7eb;
      --gray-300: #d1d5db; --gray-500: #6b7280; --gray-700: #374151; --gray-900: #111827;
    }
    body { font-family: 'Inter', -apple-system, sans-serif; font-size: 14px; line-height: 1.6; color: var(--gray-900); min-height: 100vh; }
    .hero-gradient { background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 25%, #ddd6fe 50%, #e8e0ff 75%, #f5f3ff 100%); min-height: 100vh; display: flex; flex-direction: column; }

    /* HEADER */
    header { display: flex; align-items: center; justify-content: space-between; padding: 22px 48px; background: rgba(255,255,255,0.6); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(167,139,250,0.15); position: sticky; top: 0; z-index: 100; }
    .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--gray-900); }
    .logo-icon { width: 36px; height: 36px; }
    .logo-text { font-size: 18px; font-weight: 700; background: linear-gradient(135deg, var(--purple-600), var(--purple-400)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .tagline { font-size: 11px; color: var(--gray-500); font-weight: 400; margin-top: 1px; }
    .header-right { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--gray-500); }

    /* MAIN */
    main { flex: 1; max-width: 1100px; width: 100%; margin: 0 auto; padding: 56px 48px 72px; }

    /* PHASE HEADER */
    .phase-section { margin-bottom: 36px; }
    .phase-header { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
    .phase-num { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--purple-500), var(--purple-300)); color: white; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .phase-title { font-size: 20px; font-weight: 700; color: var(--gray-900); }
    .phase-desc { font-size: 12px; color: var(--gray-500); margin-top: 2px; }

    /* CARD */
    .card { background: rgba(255,255,255,0.88); border: 1px solid rgba(167,139,250,0.18); border-radius: 20px; padding: 32px; box-shadow: 0 4px 24px rgba(147,51,234,0.06); backdrop-filter: blur(8px); transition: box-shadow 0.2s; }
    .card:hover { box-shadow: 0 8px 40px rgba(147,51,234,0.10), 0 2px 8px rgba(0,0,0,0.05); }

    /* UPLOAD GRID */
    .upload-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .upload-box { border: 2px dashed rgba(167,139,250,0.35); border-radius: 16px; padding: 36px 24px; text-align: center; cursor: pointer; transition: all 0.2s; background: rgba(250,245,255,0.5); position: relative; overflow: hidden; }
    .upload-box:hover, .upload-box.dragover { border-color: var(--purple-400); background: rgba(237,233,254,0.6); }
    .upload-box svg { width: 38px; height: 38px; color: var(--purple-400); margin-bottom: 12px; }
    .upload-label { font-size: 14px; font-weight: 600; color: var(--gray-700); display: block; }
    .upload-sub { font-size: 11px; color: var(--gray-500); margin-top: 4px; display: block; }
    .upload-box input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
    .upload-preview { display: none; margin-top: 10px; padding: 8px 12px; background: var(--purple-50); border-radius: 8px; font-size: 11px; color: var(--purple-700); word-break: break-all; text-align: left; max-height: 72px; overflow-y: auto; }
    .upload-box.has-file .upload-preview { display: block; }
    .upload-box.has-file .upload-placeholder { display: none; }
    .or-divider { text-align: center; color: var(--gray-400); font-size: 12px; margin-bottom: 20px; }

    /* INPUT */
    .input-group { margin-bottom: 18px; }
    .input-group label { display: block; font-size: 12px; font-weight: 600; color: var(--gray-700); margin-bottom: 8px; }
    textarea { width: 100%; border: 1px solid rgba(167,139,250,0.3); border-radius: 12px; padding: 13px 15px; font-family: inherit; font-size: 13px; line-height: 1.65; resize: vertical; min-height: 110px; background: rgba(250,245,255,0.5); color: var(--gray-900); transition: border-color 0.2s, box-shadow 0.2s; outline: none; }
    textarea:focus { border-color: var(--purple-400); box-shadow: 0 0 0 3px rgba(167,139,250,0.12); background: white; }
    textarea::placeholder { color: var(--gray-500); }

    /* BUTTONS */
    .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: linear-gradient(135deg, var(--purple-600), var(--purple-500)); color: white; border: none; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 14px rgba(147,51,234,0.3); text-decoration: none; }
    .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(147,51,234,0.4); }
    .btn-primary:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
    .btn-ghost { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: transparent; color: var(--purple-600); border: 1px solid rgba(167,139,250,0.35); border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .btn-ghost:hover { background: var(--purple-50); border-color: var(--purple-300); }
    .btn-download { display: inline-flex; align-items: center; gap: 6px; padding: 8px 18px; background: rgba(255,255,255,0.9); color: var(--purple-700); border: 1px solid rgba(167,139,250,0.4); border-radius: 10px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.2s; text-decoration: none; }
    .btn-download:hover { background: var(--purple-50); border-color: var(--purple-400); transform: translateY(-1px); }

    /* RESULT */
    #result { display: none; }
    .result-header { text-align: center; margin-bottom: 36px; }
    .result-header h2 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, var(--purple-700), var(--purple-400)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .score-ring-wrap { display: flex; justify-content: center; margin-bottom: 32px; }
    .score-ring { position: relative; width: 160px; height: 160px; }
    .score-ring svg { transform: rotate(-90deg); width: 160px; height: 160px; }
    .score-ring circle { fill: none; stroke-width: 10; }
    .score-ring .bg { stroke: var(--purple-100); }
    .score-ring .fg { stroke: url(#scoreGrad); stroke-dasharray: 408; stroke-dashoffset: 408; stroke-linecap: round; transition: stroke-dashoffset 1.2s cubic-bezier(0.4,0,0.2,1); }
    .score-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .score-num { font-size: 44px; font-weight: 700; color: var(--purple-600); line-height: 1; }
    .score-label { font-size: 11px; color: var(--gray-500); margin-top: 4px; font-weight: 500; }
    .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    .result-section-title { font-size: 13px; font-weight: 700; color: var(--gray-900); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .result-section-title .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

    /* MATCH ITEM */
    .match-item { padding: 13px 15px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid; }
    .match-item.match { background: rgba(240,253,244,0.6); border-color: #4ade80; }
    .match-item.gap { background: rgba(254,242,242,0.6); border-color: #f87171; }
    .match-item-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 3px; }
    .match-item.match .match-item-label { color: #16a34a; }
    .match-item.gap .match-item-label { color: #dc2626; }
    .match-item-title { font-size: 13px; font-weight: 600; color: var(--gray-900); margin-bottom: 3px; }
    .match-item-desc { font-size: 12px; color: var(--gray-600); line-height: 1.6; }

    /* KNOWLEDGE CARD */
    .knowledge-card { background: rgba(250,245,255,0.55); border: 1px solid rgba(167,139,250,0.2); border-radius: 14px; padding: 16px 18px; margin-bottom: 12px; }
    .knowledge-card .kname { font-size: 13px; font-weight: 600; color: var(--purple-700); margin-bottom: 5px; }
    .knowledge-card .kdetail { font-size: 12px; color: var(--gray-600); line-height: 1.7; }

    /* TABS */
    .tabs { display: flex; gap: 4px; background: var(--purple-50); border: 1px solid rgba(167,139,250,0.2); border-radius: 12px; padding: 4px; margin-bottom: 24px; width: fit-content; }
    .tab { padding: 7px 18px; border-radius: 9px; font-size: 13px; font-weight: 500; color: var(--gray-600); cursor: pointer; border: none; background: transparent; font-family: inherit; transition: all 0.15s; }
    .tab.active { background: white; color: var(--purple-700); font-weight: 600; box-shadow: 0 1px 4px rgba(147,51,234,0.12); }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* LOADING */
    .loading-overlay { display: none; position: fixed; inset: 0; background: rgba(250,245,255,0.7); backdrop-filter: blur(6px); z-index: 999; align-items: center; justify-content: center; flex-direction: column; gap: 16px; }
    .loading-overlay.active { display: flex; }
    .spinner { width: 40px; height: 40px; border: 3px solid var(--purple-100); border-top-color: var(--purple-500); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: var(--purple-600); font-weight: 500; }

    footer { text-align: center; padding: 28px 48px; font-size: 12px; color: var(--gray-500); border-top: 1px solid rgba(167,139,250,0.1); background: rgba(255,255,255,0.4); backdrop-filter: blur(8px); }
  </style>
</head>
<body>
<div class="hero-gradient">

  <header>
    <a class="logo" href="/">
      <svg class="logo-icon" viewBox="0 0 64 64" fill="none">
        <defs><linearGradient id="dolphinGrad" x1="0" y1="0" x2="64" y2="64"><stop offset="0%" stop-color="#9333ea"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs>
        <path d="M48 20C48 20 56 14 58 22C60 30 52 34 44 36C36 38 26 40 18 36C10 32 6 24 10 18C14 12 24 12 32 16C40 20 44 26 44 26" stroke="url(#dolphinGrad)" stroke-width="2.5" stroke-linecap="round" fill="rgba(167,139,250,0.08)"/>
        <path d="M18 36C14 34 10 30 12 26" stroke="url(#dolphinGrad)" stroke-width="2" stroke-linecap="round"/>
        <path d="M44 26C46 22 50 18 52 22" stroke="url(#dolphinGrad)" stroke-width="2" stroke-linecap="round"/>
        <circle cx="52" cy="22" r="2" fill="#9333ea" opacity="0.6"/>
      </svg>
      <div>
        <div class="logo-text">Interview System</div>
        <div class="tagline">Dolphin · AI 智能面试助手</div>
      </div>
    </a>
    <div class="header-right">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      Phase 1 · 面试前准备
    </div>
  </header>

  <main>

    <!-- PHASE 1 -->
    <div class="phase-section">
      <div class="phase-header">
        <div class="phase-num">1</div>
        <div>
          <div class="phase-title">面试前准备</div>
          <div class="phase-desc">上传职位 JD 与个人简历，AI 分析匹配度与知识准备建议</div>
        </div>
      </div>

      <div class="card">
        <div class="upload-grid">
          <div class="upload-box" id="jdBox">
            <div class="upload-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
              <span class="upload-label">上传职位 JD</span>
              <span class="upload-sub">PDF · Word · 图片</span>
            </div>
            <div class="upload-preview" id="jdPreview"></div>
            <input type="file" id="jdFile" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="handleFile(this, 'jd')">
          </div>
          <div class="upload-box" id="resumeBox">
            <div class="upload-placeholder">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              <span class="upload-label">上传个人简历</span>
              <span class="upload-sub">PDF · Word · 图片</span>
            </div>
            <div class="upload-preview" id="resumePreview"></div>
            <input type="file" id="resumeFile" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png" onchange="handleFile(this, 'resume')">
          </div>
        </div>
        <div class="or-divider">或直接粘贴文本内容</div>

        <div class="input-group">
          <label>职位描述（JD）</label>
          <textarea id="jdText" placeholder="粘贴职位描述内容，或描述岗位职责与要求…"></textarea>
        </div>
        <div class="input-group">
          <label>个人简历</label>
          <textarea id="resumeText" placeholder="粘贴简历内容，或描述工作经历、项目经验、技术栈…"></textarea>
        </div>

        <div style="display:flex; gap:12px; align-items:center;">
          <button class="btn-primary" onclick="analyze()" id="analyzeBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg>
            开始分析
          </button>
          <button class="btn-ghost" onclick="clearAll()">清空</button>
        </div>
      </div>
    </div>

    <!-- RESULT -->
    <div id="result">
      <div class="result-header">
        <h2>匹配分析报告</h2>
      </div>

      <div class="score-ring-wrap">
        <div class="score-ring">
          <svg viewBox="0 0 160 160">
            <defs><linearGradient id="scoreGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#9333ea"/><stop offset="100%" stop-color="#c084fc"/></linearGradient></defs>
            <circle class="bg" cx="80" cy="80" r="65"/>
            <circle class="fg" id="scoreFg" cx="80" cy="80" r="65"/>
          </svg>
          <div class="score-center">
            <div class="score-num" id="scoreNum">0</div>
            <div class="score-label">匹配得分</div>
          </div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab active" onclick="switchTab(this, 'tab-match')">匹配分析</button>
        <button class="tab" onclick="switchTab(this, 'tab-knowledge')">知识准备</button>
        <button class="tab" onclick="switchTab(this, 'tab-study')">学习大纲</button>
      </div>

      <div id="tab-match" class="tab-content active">
        <div class="result-grid">
          <div>
            <div class="result-section-title"><span class="dot" style="background:#4ade80"></span>匹配项</div>
            <div id="matchItems"></div>
          </div>
          <div>
            <div class="result-section-title"><span class="dot" style="background:#f87171"></span>不足项</div>
            <div id="gapItems"></div>
          </div>
        </div>
      </div>

      <div id="tab-knowledge" class="tab-content">
        <div id="knowledgeItems"></div>
      </div>

      <div id="tab-study" class="tab-content">
        <div id="studyPlanItems"></div>
      </div>

      <div style="text-align:center; margin-top:32px; display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <button class="btn-primary" onclick="enterMockInterview()">
          进入模拟面试
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 7l5 5m0 0l-5 5m5-5H6"/></svg>
        </button>
        <button class="btn-download" onclick="downloadPhase1()" id="downloadPhase1Btn" style="display:none;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          导出分析报告
        </button>
      </div>
    </div>

  </main>

  <footer>Powered by MiniMax · Dolphin AI · Interview System</footer>
</div>

<!-- 简历上传说明 -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="spinner"></div>
  <div class="loading-text">海豚正在分析中…</div>
</div>

<script>
  let analysisResult = null;

  // 存储上传文件解析后的文本
  const uploadedTexts = { jd: '', resume: '' };
  // 跟踪当前正在上传的文件数量
  let pendingUploads = 0;

  function handleFile(input, type) {
    const file = input.files[0];
    if (!file) return;
    const box = document.getElementById(type + 'Box');
    const preview = document.getElementById(type + 'Preview');
    preview.textContent = '📄 ' + file.name + ' (上传中…)';
    box.classList.add('has-file');

    pendingUploads++;
    const formData = new FormData();
    formData.append('file', file);
    fetch('/api/preparation/upload', { method: 'POST', body: formData })
      .then(async r => {
        if (!r.ok) {
          const err = await r.text();
          throw new Error('上传失败 ' + r.status + ': ' + err);
        }
        const ct = r.headers.get('content-type') || '';
        if (!ct.includes('json')) {
          const txt = await r.text();
          throw new Error('非JSON响应: ' + txt.slice(0, 100));
        }
        return r.json();
      })
      .then(data => {
        const text = data.text || '';
        uploadedTexts[type] = text;
        document.getElementById(type + 'Text').value = text;
        preview.textContent = '📄 ' + file.name + ' ✓ 已解析 ' + text.length + ' 字';
      })
      .catch(e => {
        console.error('[handleFile] 错误:', e);
        preview.textContent = '📄 ' + file.name + ' ✗ ' + (e.message || '解析失败');
      })
      .finally(() => {
        pendingUploads--;
      });
  }

  async function analyze() {
    // 如果有文件正在上传，等待完成
    if (pendingUploads > 0) {
      document.querySelector('.loading-text').textContent = '正在解析文件…';
    }
    while (pendingUploads > 0) {
      await new Promise(r => setTimeout(r, 300));
    }

    const jd = (document.getElementById('jdText').value.trim() || uploadedTexts.jd);
    const resume = (document.getElementById('resumeText').value.trim() || uploadedTexts.resume);
    if (!jd && !resume) { alert('请上传文件或粘贴简历内容'); return; }

    showLoading(true);
    try {
      const res = await fetch('/api/preparation/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ jd_text: jd, resume_text: resume, auto_save_resume: true })
      });
      const data = await res.json();
      analysisResult = data;
      document.getElementById('result').style.display = 'block';
      document.getElementById('result').scrollIntoView({ behavior: 'smooth' });
      renderResult(data);
    } catch(e) {
      console.error('分析失败:', e);
      alert('分析失败: ' + e.message);
    } finally {
      showLoading(false);
    }
  }

  function renderResult(data) {
    // Show download button
    const dlBtn = document.getElementById('downloadPhase1Btn');
    if (dlBtn) dlBtn.style.display = 'inline-flex';

    // Score ring
    const score = data.overall_score || 0;
    const circumference = 2 * Math.PI * 65;
    document.getElementById('scoreFg').style.strokeDashoffset = circumference - (score / 100) * circumference;
    document.getElementById('scoreNum').textContent = score;

    // Match / Gap
    const matches = data.matched_items || [];
    const gaps = data.gap_items || [];

    document.getElementById('matchItems').innerHTML = matches.length
      ? matches.map(m => `
        <div class="match-item match">
          <div class="match-item-label">✓ 匹配</div>
          <div class="match-item-title">${escHtml(m.aspect || '')}</div>
          <div class="match-item-desc">${escHtml(m.jd_requirement || '')}</div>
          <div class="match-item-desc" style="margin-top:4px;font-size:11px;color:var(--gray-500);">简历：${escHtml(m.resume_evidence || '')}</div>
          <div class="match-item-desc">${escHtml(m.analysis || '')}</div>
        </div>`).join('')
      : '<p style="color:var(--gray-500);font-size:13px;">暂无数据</p>';

    document.getElementById('gapItems').innerHTML = gaps.length
      ? gaps.map(g => `
        <div class="match-item gap">
          <div class="match-item-label">△ 不足 <span style="font-weight:400;font-size:10px;">${escHtml(g.severity || '')}</span></div>
          <div class="match-item-title">${escHtml(g.aspect || '')}</div>
          <div class="match-item-desc">${escHtml(g.jd_requirement || '')}</div>
          <div class="match-item-desc" style="margin-top:4px;">${escHtml(g.gap_description || g.suggestion || '')}</div>
        </div>`).join('')
      : '<p style="color:var(--gray-500);font-size:13px;">暂无数据</p>';

    // Knowledge
    const knowledge = data.knowledge_areas || [];
    document.getElementById('knowledgeItems').innerHTML = knowledge.length
      ? knowledge.map(k => `
        <div class="knowledge-card">
          <div class="kname">${escHtml(k.category || '')} <span style="font-size:10px;font-weight:400;color:var(--purple-400)">${escHtml(k.priority || '')} ${escHtml(k.jd_frequency || '')}</span></div>
          <div class="kdetail">${Array.isArray(k.topics) ? k.topics.map(t => `<span style="display:block;padding:2px 0;">· ${escHtml(t)}</span>`).join('') : escHtml(k.topics || '')}</div>
        </div>`).join('')
      : '<p style="color:var(--gray-500);font-size:13px;">暂无数据</p>';

    // Study Plan
    const studyEl = document.getElementById('studyPlanItems') || null;
    if (studyEl) {
      const plan = data.detailed_study_plan || [];
      studyEl.innerHTML = plan.length
        ? plan.map(a => `
          <div style="margin-bottom:16px;">
            <div style="font-weight:700;font-size:13px;color:var(--purple-700);margin-bottom:8px;">${escHtml(a.area || '')}</div>
            ${(a.sub_areas || []).map(s => `
              <div style="margin-bottom:10px;padding:10px;background:rgba(255,255,255,0.7);border-radius:10px;border:1px solid rgba(167,139,250,0.15);">
                <div style="font-weight:600;font-size:12px;margin-bottom:5px;">${escHtml(s.name || '')} <span style="font-size:10px;color:var(--purple-400);font-weight:400;">${escHtml(s.importance || '')} · ${escHtml(s.estimated_study_time || '')}</span></div>
                <div style="font-size:11px;color:var(--gray-700);margin-bottom:5px;">${Array.isArray(s.key_points) ? s.key_points.map(p => `<span style="display:block;padding:1px 0;">• ${escHtml(p)}</span>`).join('') : ''}</div>
                ${s.study_resources ? `<div style="font-size:10px;color:var(--gray-500);margin-top:4px;">📚 ${escHtml(s.study_resources)}</div>` : ''}
              </div>`).join('')}
          </div>`).join('')
        : '<p style="color:var(--gray-500);font-size:13px;">暂无学习计划数据</p>';
    }
  }

  function switchTab(btn, id) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(id).classList.add('active');
  }

  function enterMockInterview() {
    const jd = document.getElementById('jdText').value.trim();
    const resume = document.getElementById('resumeText').value.trim();
    if (!analysisResult) { alert('请先完成面试前准备分析'); return; }
    // 写入 interviewCtx（interview.html 读取的 key）
    sessionStorage.setItem('interviewCtx', JSON.stringify({
      analysis: analysisResult,
      jd_text: jd,
      resume_text: resume
    }));
    window.location.href = '/static/interview.html';
  }

  function clearAll() {
    ['jdText', 'resumeText'].forEach(id => document.getElementById(id).value = '');
    ['jdBox', 'resumeBox'].forEach(id => { const b = document.getElementById(id); b.classList.remove('has-file'); });
    ['jdPreview', 'resumePreview'].forEach(id => document.getElementById(id).textContent = '');
    document.getElementById('result').style.display = 'none';
    const dlBtn = document.getElementById('downloadPhase1Btn');
    if (dlBtn) dlBtn.style.display = 'none';
    analysisResult = null;
  }

  function downloadPhase1() {
    if (!analysisResult) return;
    const jd = document.getElementById('jdText').value.trim();
    const resume = document.getElementById('resumeText').value.trim();
    const content = `# Phase 1 · 面试前准备分析报告

## 匹配分析
综合得分：${analysisResult.overall_score || 0} / 100

### 匹配项
${(analysisResult.matched_items || []).map(m => `- ✓ ${m.aspect || ''}\n  JD要求：${m.jd_requirement || ''}\n  简历证据：${m.resume_evidence || ''}\n  分析：${m.analysis || ''}`).join('\n\n')}

### 不足项
${(analysisResult.gap_items || []).map(g => `- △ ${g.aspect || ''}\n  JD要求：${g.jd_requirement || ''}\n  差距：${g.gap_description || g.suggestion || ''}`).join('\n\n')}

## JD要求分析
${(analysisResult.jd_requirements_analysis || []).map(r => `- 【${r.match_degree === '完全匹配' ? '匹配' : r.match_degree === '未涉及' ? '缺失' : '部分'}] ${r.requirement || ''}\n  简历证据：${r.resume_evidence || '（无）'}\n  分析：${r.analysis || ''}`).join('\n\n')}

## 知识准备建议
${(analysisResult.knowledge_areas || []).map(k => `### ${k.category || ''} (${k.priority || ''})\n${Array.isArray(k.topics) ? k.topics.map(t => `- ${t}`).join('\n') : k.topics || ''}`).join('\n\n')}

## 学习大纲
${(analysisResult.detailed_study_plan || []).map(a => `### ${a.area || ''}\n${(a.sub_areas || []).map(s => `- ${s.name || ''} (${s.importance || ''}, 预计${s.estimated_study_time || ''})\n  关键点：${Array.isArray(s.key_points) ? s.key_points.join('、') : ''}\n  资源：${s.study_resources || ''}`).join('\n')}`).join('\n\n')}

## 面试问题准备
${(analysisResult.questions_to_prepare || []).map((q, i) => `Q${i+1}：${q.question || ''}\n框架：${q.answer_framework || ''}\n关键点：${q.key_points || ''}${q.common_mistakes ? '\n⚠ 常犯错误：' + q.common_mistakes : ''}`).join('\n\n')}

---
原始输入（JD）：${jd || '（无）'}
原始输入（简历）：${resume || '（无）'}
`;
    downloadText(content, 'phase1-面试前准备报告.md');
  }

  function downloadText(text, filename) {
    const blob = new Blob(['﻿' + text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
  }

  function showLoading(show) {
    document.getElementById('loadingOverlay').classList.toggle('active', show);
    document.getElementById('analyzeBtn').disabled = show;
  }

  function escHtml(s) {
    if (!s) return '';
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
</body>
</html>
